# Raz w miesiącu GitHub proponuje drobne aktualizacje bibliotek.
# Duże wersje (major) aktualizujemy ręcznie, po sprawdzeniu zmian.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      biblioteki:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
