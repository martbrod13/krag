name: Aktualizacja package-lock.json

# When package.json changes on a working branch, this workflow updates
# package-lock.json, commits it to the same branch and runs the checks again.
on:
  push:
    branches-ignore: [main, "dependabot/**"]
    paths: [package.json]

permissions:
  contents: write
  actions: write

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Aktualizacja package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Aktualizacja package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Zapisanie zmian i ponowne sprawdzenie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json jest aktualny."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Zaktualizuj package-lock.json"
          git push
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
