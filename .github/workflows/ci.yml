name: Sprawdzenie kodu

on:
  pull_request:
  push:
    branches: [main]
  # Lets the package-lock.json workflow run the checks again after its commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Test database that exists only while the checks run. It holds no real data.
  DATABASE_URL: postgresql://krag:krag@localhost:5432/krag
  SHADOW_DATABASE_URL: postgresql://krag:krag@localhost:5432/krag_shadow
  # Secret used only by these checks, never by a real deployment.
  BETTER_AUTH_SECRET: ci-only-secret-never-used-in-production-0123456789

jobs:
  check:
    name: Formatowanie, lint, tłumaczenia, baza danych, typy, build i test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: krag
          POSTGRES_PASSWORD: krag
          POSTGRES_DB: krag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U krag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Instalacja zależności
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Formatowanie (Prettier)
        run: |
          npx prettier --write . --log-level warn
          git diff --exit-code || {
            echo "::error::Kod nie jest sformatowany. Uruchom: npm run format"
            exit 1
          }

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tłumaczenia (te same teksty we wszystkich językach)
        run: npm run check:messages

      - name: Baza danych - schemat
        run: npx prisma validate

      - name: Baza danych - czy migracje zgadzają się ze schematem
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE krag_shadow"
          set +e
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --script --exit-code > migration-diff.sql
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "Brakująca migracja (SQL):"
            cat migration-diff.sql
            echo "::error::Schemat bazy różni się od migracji w prisma/migrations. Dodaj nową migrację."
            exit 1
          fi
          exit "$code"

      - name: Baza danych - migracje i dane testowe
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:seed

      - name: Testy na bazie (kręgi, ekran seniora, ustawienia)
        run: npm run test:db

      - name: Typy (TypeScript)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test dymny (strony, języki, logowanie i ekran seniora)
        run: npm run test:smoke
